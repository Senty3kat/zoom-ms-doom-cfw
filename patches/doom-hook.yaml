# Doom CFW hook (MS-70CDR 2.10). Generated by doom/build_cfw.py.
# The boot step's callp to the boot screen (0xC00BB144) goes to a trampoline at
# 0xC00F4000, which branches to doom_hook in shared RAM (loader/loader_entry.asm).
name: doom-hook
description: After the boot logo, load and start Doom from the file system
builds: [ms70cdr-2.10]
write:
  - model: ms70cdr-2.10
    addr: 0xC00BB144
    expect: "12a82410"
    data: "12d87110"
section:
  - model: ms70cdr-2.10
    addr: 0xC00F4000
    source: doom/build_cfw.py
    data: "2a0000006a004000620300000080000000000000000000000000000000000000"
  - model: ms70cdr-2.10
    addr: 0x80000000
    source: doom/loader
    data: ""
